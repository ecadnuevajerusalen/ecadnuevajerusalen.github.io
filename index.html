<style>
/* ===============================================================
   Oración Implacable — hoja de estilo
   Negro tinta cálido, filetes dorados, tipografía Times.
   Sin degradados, sin cursivas, sin esquinas redondeadas.
   =============================================================== */
:root{
  --tinta:#121110;
  --tinta-2:#1A1815;
  --tinta-3:#221F1B;
  --hueso:#EFEBE2;
  --tenue:#A49C8C;
  --tenue-2:#78705F;
  --oro:#C9A227;
  --oro-claro:#E3C463;
  --linea:#2E2A24;
  --linea-oro:#4A3D18;
  --peltre:#8FA6BC;
  --pizarra:#8079AE;
  --perla:#DCCFB4;
  --alerta:#C4543D;
  --exito:#7E9B58;
  --serif:"Times New Roman",Tinos,"Liberation Serif",Georgia,serif;
}

/* colores por grupo — metales, el oro reservado a la élite */
.g1{--tono:var(--peltre)}
.g2{--tono:var(--pizarra)}
.g3{--tono:var(--oro)}
.g4{--tono:var(--perla)}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--tinta);
  color:var(--hueso);
  font-family:var(--serif);
  font-size:17px;
  line-height:1.5;
}

/* ---------- recursos tipográficos ---------- */
.rotulo{
  display:block;font-size:.68rem;letter-spacing:.3em;text-transform:uppercase;
  color:var(--tenue-2);
}
.sep{
  display:inline-block;width:1px;height:.8em;background:var(--linea);
  margin:0 .7em;vertical-align:-.05em;
}
.titular{
  font-weight:400;margin:.18em 0 0;
  font-size:clamp(2.1rem,5.2vw,3.5rem);line-height:1.03;
  letter-spacing:.005em;text-wrap:balance;
}
.lema{
  margin:.5em 0 0;color:var(--oro);
  font-size:clamp(.76rem,1.15vw,.88rem);
  letter-spacing:.22em;text-transform:uppercase;
}
.regla-doble{
  border:0;border-top:1px solid var(--linea-oro);border-bottom:1px solid var(--linea-oro);
  height:3px;margin:0;width:100%;
}

/* ---------- logo ---------- */
.logo{display:block;flex:none}
img.logo.grande{width:132px;height:auto;margin:0 auto}
img.logo.chico{width:70px;height:auto}
.monograma{
  display:grid;place-items:center;border:1px solid var(--oro);color:var(--oro);
  letter-spacing:.1em;
}
.monograma.grande{width:104px;height:104px;font-size:2.2rem;margin:0 auto}
.monograma.chico{width:62px;height:62px;font-size:1.3rem}

/* ---------- portada ---------- */
.portada{min-height:100vh;display:grid;place-items:center;padding:40px 18px}
.portada-caja{
  width:100%;max-width:600px;text-align:center;
  border:1px solid var(--linea-oro);padding:44px 40px 38px;background:var(--tinta-2);
}
.portada .rotulo{margin-top:20px}
.portada .regla-doble{margin:22px 0}
.portada .verso{margin:0}
.cargando{color:var(--tenue);margin:16px 0 0;letter-spacing:.14em;
  text-transform:uppercase;font-size:.8rem}

.acceso{margin-top:26px;text-align:left;display:flex;flex-direction:column;gap:10px}
.acceso label{
  font-size:.68rem;letter-spacing:.22em;text-transform:uppercase;color:var(--tenue-2);
}
.acceso-botones{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
.acceso-botones button{flex:1 1 170px}
.pista{font-size:.82rem;color:var(--tenue-2);line-height:1.45}
.enlace{
  margin-top:24px;background:none;border:0;color:var(--tenue-2);
  font-family:var(--serif);font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;
  cursor:pointer;padding:6px;border-bottom:1px solid var(--linea);
}
.enlace:hover{color:var(--oro);border-bottom-color:var(--linea-oro)}

/* ---------- controles ---------- */
input[type=text],input[type=password],input[type=number],textarea{
  font-family:var(--serif);font-size:1rem;color:var(--hueso);
  background:var(--tinta);border:1px solid var(--linea);border-radius:0;
  padding:11px 13px;width:100%;min-width:0;
}
input:focus-visible,textarea:focus-visible{outline:1px solid var(--oro);outline-offset:2px;border-color:var(--linea-oro)}
input::placeholder,textarea::placeholder{color:var(--tenue-2)}

button{
  font-family:var(--serif);font-size:.76rem;letter-spacing:.18em;text-transform:uppercase;
  cursor:pointer;border-radius:0;padding:11px 18px;
  border:1px solid var(--linea);background:transparent;color:var(--hueso);
  transition:border-color .15s ease,color .15s ease,background-color .15s ease;
}
button:hover:not(:disabled){border-color:var(--tenue-2)}
button:focus-visible{outline:1px solid var(--oro);outline-offset:2px}
button.primario{background:var(--oro);color:#17140B;border-color:var(--oro)}
button.primario:hover:not(:disabled){background:var(--oro-claro);border-color:var(--oro-claro)}
button.fantasma{font-size:.68rem;padding:8px 13px;color:var(--tenue)}
button.fantasma:hover{color:var(--hueso)}
button.peligro{border-color:#4A2A22;color:var(--alerta)}

/* ---------- cabecera del tablero ---------- */
.envoltura{max-width:1620px;margin:0 auto;padding:20px 22px 34px;
  display:flex;flex-direction:column;gap:14px}
.cabecera{display:flex;flex-direction:column;gap:14px}
.cab-alto{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-end;justify-content:space-between}
.cab-marca{display:flex;gap:18px;align-items:center;min-width:0}
.cab-txt{min-width:0}

/* franja de datos, sin píldoras ni puntos */
.meta{display:flex;flex-wrap:wrap;align-items:stretch}
.meta-item{padding:2px 22px;border-left:1px solid var(--linea);display:flex;flex-direction:column;gap:2px}
.meta-item:first-child{border-left:0;padding-left:0}
.meta-item:last-child{padding-right:0}
.meta-et{font-size:.62rem;letter-spacing:.22em;text-transform:uppercase;color:var(--tenue-2)}
.meta-va{font-size:.95rem;color:var(--hueso);font-variant-numeric:tabular-nums;white-space:nowrap}
.meta-va.oro{color:var(--oro)}
.meta-va.mal{color:var(--alerta)}
.meta-va.bien{color:var(--exito)}

.barra{
  display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;
  border-top:1px solid var(--linea);border-bottom:1px solid var(--linea);padding:8px 0;
}
.quien{font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--tenue-2)}
.quien b{color:var(--hueso);font-weight:400;letter-spacing:.08em}
.barra-acc{display:flex;gap:8px;flex-wrap:wrap}

.aviso{padding:11px 16px;font-size:.9rem;border:1px solid var(--linea);
  background:var(--tinta-2);color:var(--tenue)}
.aviso.mal{border-color:#4A2A22;color:#E0B7AC}
.aviso b{color:var(--hueso);font-weight:400}
.sub{margin:0;color:var(--tenue);font-size:.9rem}

/* ---------- leyenda de grupos ---------- */
.leyenda{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--linea)}
.ley{padding:11px 20px 9px;border-left:1px solid var(--linea);position:relative}
.ley:first-child{border-left:0;padding-left:0}
.ley::before{
  content:"";position:absolute;top:-1px;left:0;right:0;height:2px;background:var(--tono);
}
.ley:first-child::before{left:0}
.ley-n{display:block;font-size:.82rem;letter-spacing:.2em;text-transform:uppercase;color:var(--tono)}
.ley-d{display:block;margin-top:4px;font-size:.84rem;color:var(--tenue);
  font-variant-numeric:tabular-nums}
.ley-l{display:block;font-size:.8rem;color:var(--tenue-2)}

/* ---------- tira de horarios ---------- */
.tira{display:grid;grid-template-columns:repeat(9,1fr);gap:10px;align-items:stretch}
.tira.siete{grid-template-columns:repeat(7,1fr)}

.col{
  display:flex;flex-direction:column;min-width:0;
  background:var(--tinta-2);border:1px solid var(--linea);
  border-top:2px solid var(--tono);padding:13px 13px 12px;
}
.col.elite{border-color:var(--linea-oro);border-top-color:var(--oro);background:var(--tinta-3)}

.col-grupo{
  display:block;font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--tono);line-height:1.35;height:2.9em;overflow:hidden;
}
.col-hora{display:block;font-size:2.6rem;line-height:1;font-variant-numeric:tabular-nums}
.col.elite .col-hora{color:var(--oro)}
.col-hora.dia{font-size:1.5rem;letter-spacing:.02em}
.col-rango{display:block;margin-top:3px;font-size:.74rem;color:var(--tenue);
  font-variant-numeric:tabular-nums}

.col-libres{
  margin:11px 0 0;padding:7px 0;font-size:.68rem;letter-spacing:.14em;
  text-transform:uppercase;color:var(--tenue-2);
  border-top:1px solid var(--linea);border-bottom:1px solid var(--linea);
}
.col-libres b{color:var(--tono);font-weight:400;font-size:1.05rem;letter-spacing:0}
.col-libres.cero{color:var(--tenue-2)}

.nombres{list-style:none;margin:0;padding:0;flex:1}
.nombres li{
  display:flex;align-items:baseline;gap:6px;justify-content:space-between;
  font-size:.87rem;line-height:1.3;padding:5px 0;border-bottom:1px solid var(--linea);
}
.nombres li span{overflow-wrap:anywhere}
.nombres li.yo span{color:var(--oro)}
.nombres.ancha{display:flex;flex-wrap:wrap;gap:0 26px}
.nombres.ancha li{border-bottom:0;flex:0 1 auto;padding:3px 0}
.vacio{margin:0;flex:1;padding:7px 0;font-size:.72rem;letter-spacing:.14em;
  text-transform:uppercase;color:var(--tenue-2)}
.quitar{
  border:0;background:transparent;color:var(--tenue-2);padding:0 2px;
  font-size:.95rem;letter-spacing:0;line-height:1;flex:none;text-transform:none;
}
.quitar:hover{color:var(--alerta)}

.col-pie{margin-top:auto;padding-top:10px}
.col-resp-et{display:block;font-size:.58rem;letter-spacing:.2em;text-transform:uppercase;
  color:var(--tenue-2)}
.col-resp{display:block;margin:2px 0 0;font-size:.82rem;color:var(--tenue);
  overflow-wrap:anywhere}
button.tomar{
  width:100%;margin-top:11px;padding:9px 6px;font-size:.68rem;
  border-color:var(--tono);color:var(--tono);
}
button.tomar:hover{background:var(--tono);color:#17140B}
button.tomar.grande{padding:13px;font-size:.74rem}

/* ---------- matutino ---------- */
.matutino{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.bloque{background:var(--tinta-2);border:1px solid var(--linea);
  border-top:2px solid var(--oro);padding:20px 22px}
.bloque h3{margin:0 0 4px;font-size:.72rem;letter-spacing:.22em;
  text-transform:uppercase;color:var(--oro);font-weight:400}
.bloque .regla-doble{margin:12px 0 14px}
.programa{list-style:none;margin:0;padding:0}
.programa li{display:flex;gap:16px;align-items:baseline;
  border-bottom:1px solid var(--linea);padding:8px 0}
.programa li b{color:var(--hueso);font-weight:400;min-width:60px;
  font-variant-numeric:tabular-nums}
.programa li em{margin-left:auto;color:var(--tenue-2);font-size:.84rem;font-style:normal}

/* ---------- reglas ---------- */
.reglas{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0}
.regla{padding:13px 22px 0;border-left:1px solid var(--linea);border-top:1px solid var(--linea)}
.regla:first-child{border-left:0;padding-left:0}
.regla h4{margin:0 0 5px;font-size:.62rem;letter-spacing:.22em;text-transform:uppercase;
  color:var(--oro);font-weight:400}
.regla p{margin:0;font-size:.87rem;color:var(--tenue);line-height:1.45}

/* ---------- versículo ---------- */
.verso{margin:0;padding:0;text-align:center}
.verso .regla-doble{margin:0}
.verso p{
  margin:0;padding:24px 20px 16px;max-width:34ch;margin-inline:auto;
  font-size:clamp(1.1rem,1.9vw,1.62rem);line-height:1.4;text-wrap:balance;color:var(--hueso);
}
.verso cite{
  display:block;padding-bottom:22px;font-style:normal;
  font-size:.64rem;letter-spacing:.3em;text-transform:uppercase;color:var(--oro);
}

/* ---------- panel ---------- */
.panel{background:var(--tinta-2);border:1px solid var(--linea);
  border-top:2px solid var(--oro);padding:22px;display:flex;flex-direction:column;gap:16px}
.panel h2{font-size:.78rem;letter-spacing:.24em;text-transform:uppercase;
  color:var(--oro);margin:0;font-weight:400}
.campos{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.campo{display:flex;flex-direction:column;gap:6px}
.campo label{font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:var(--tenue-2)}
.campo textarea{min-height:110px;resize:vertical;font-size:.92rem;line-height:1.45}
.elector{display:flex;flex-wrap:wrap;gap:8px}
.elector button.activa{background:var(--oro);color:#17140B;border-color:var(--oro)}
.fila-acc{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.divisor{height:1px;background:var(--linea)}
.salida{display:flex;flex-direction:column;gap:6px}
.salida:empty{display:none}
.salida textarea{min-height:190px;font-size:.84rem;line-height:1.4}
.salida label{font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:var(--tenue-2)}

/* ---------- modo pantalla ---------- */
.salir-pantalla{display:none}
body.pantalla .barra,body.pantalla .panel,body.pantalla .reglas{display:none}
body.pantalla .envoltura{max-width:none;padding:18px 26px 16px;gap:12px;min-height:100vh}
body.pantalla .col{padding:11px 11px 10px}
body.pantalla .verso p{padding:18px 20px 12px}
body.pantalla .verso cite{padding-bottom:16px}
body.pantalla .meta-item{padding-top:0;padding-bottom:0}
body.pantalla .tira{flex:1 1 auto}
body.pantalla .col-hora{font-size:3.2rem}
body.pantalla .col-grupo{font-size:.68rem}
body.pantalla .nombres li{font-size:1rem}
body.pantalla .quitar{display:none}
body.pantalla button.tomar{display:none}
body.pantalla .ley-n{font-size:.92rem}
body.pantalla .verso p{font-size:1.6rem}
body.pantalla .salir-pantalla{
  display:block;position:fixed;right:16px;bottom:16px;z-index:9;opacity:.22;
}
body.pantalla .salir-pantalla:hover{opacity:1}

/* ---------- adaptable ---------- */
@media (max-width:1279px){
  .tira{grid-template-columns:repeat(5,1fr)}
  .tira.siete{grid-template-columns:repeat(4,1fr)}
  .leyenda{grid-template-columns:repeat(2,1fr)}
  .ley:nth-child(3){border-left:0;padding-left:0}
}
@media (max-width:899px){
  .tira,.tira.siete{grid-template-columns:repeat(3,1fr)}
  .matutino{grid-template-columns:1fr}
  .meta-item{padding:2px 16px}
}
@media (max-width:599px){
  body{font-size:16px}
  .envoltura{padding:16px 14px 34px;gap:12px}
  .tira,.tira.siete{grid-template-columns:repeat(2,1fr);gap:9px}
  .leyenda{grid-template-columns:1fr}
  .ley{border-left:0;padding-left:0;padding-right:0;border-top:1px solid var(--linea)}
  .ley:first-child{border-top:0}
  .meta{gap:0}
  .meta-item{padding:4px 0;border-left:0;border-top:1px solid var(--linea);width:100%;
    flex-direction:row;justify-content:space-between;align-items:baseline}
  .cab-marca{gap:13px}
  img.logo.chico{width:54px}
  .titular{font-size:1.85rem}
  .portada-caja{padding:30px 22px 26px}
  .col-hora{font-size:2.1rem}
  .col-grupo{height:auto;margin-bottom:6px}
  .regla{border-left:0;padding-left:0;padding-right:0}
}

</style>
</head>

<script>
/* ================================================================
   Oración Implacable — Embajadores de Cristo, Nueva Jerusalén
   Tablero de estrategia de oración en tiempo real.
   ================================================================ */

var CONFIG_FIREBASE = window.CONFIG_FIREBASE || null;
var LOGO = window.LOGO_ECAD || "";

(function(){
"use strict";

/* ============ definiciones fijas ============ */
var DIAS = ["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];

var GRUPOS = {
  centinelas:  {n:"Centinelas",            c:"g1", lema:"Abren la vigilia"},
  vigias:      {n:"Vigías de Medianoche",  c:"g2", lema:"Cruzan el cambio de día"},
  implacables: {n:"Guardia Implacable",    c:"g3", lema:"Las horas más duras · solo 5 por hora"},
  alba:        {n:"Guerreros del Amanecer", c:"g4", lema:"Cierran la cadena y reciben la mañana"}
};
var ORDEN_GRUPOS = ["centinelas","vigias","implacables","alba"];

function grupoDe(h){
  if (h === 21 || h === 22) return "centinelas";
  if (h === 23 || h === 0)  return "vigias";
  if (h >= 1 && h <= 4)     return "implacables";
  return "alba";
}

var CONFIG_DEF = {
  v:2,
  estrategia:"cadena",
  titulo:"Oración Implacable",
  mes:"Septiembre 2026",
  lema:"Logrando un Avivamiento Espiritual Real",
  abierto:true,
  pin:"1234",
  directivos:[
    "Kevin Vásquez | Presidente",
    "René Barrera | Vicepresidente",
    "Lemuel Cruz | Secretario",
    "Yorleni V. | Tesorera",
    "Melanie de los Santos | Vocal I",
    "Alba Orozco | Vocal II",
    "Gabriela Barrera | Vocal III",
    "Belén Luna | Vocal IV"
  ],
  cadenaFecha:"Viernes 4 de septiembre, 9:00 p. m. → 6:00 a. m.",
  semanaFechas:"Del lunes 7 al domingo 13 de septiembre",
  minutos:5,
  matFecha:"Sábado 12 de septiembre",
  matHora:"4:30 a. m.",
  matLugar:"Templo central",
  matPrograma:"04:30 | Apertura y bienvenida | Lemuel Cruz\n04:45 | Alabanza y adoración | Gabriela Barrera\n05:15 | Palabra breve | Kevin Vásquez\n05:35 | Ministración y oración por el avivamiento | Toda la directiva\n06:10 | Cierre y desayuno compartido | Yorleni V."
};

function construirFranjas(){
  var horas = [21,22,23,0,1,2,3,4,5], out = [];
  for (var i=0;i<horas.length;i++){
    var h = horas[i], g = grupoDe(h);
    out.push({id:"h"+h, ini:h, grupo:g, cupo: g === "implacables" ? 5 : 8});
  }
  return out;
}
var FRANJAS = construirFranjas();
var DIAS_ID = DIAS.map(function(d,i){ return {id:"d"+i, nombre:d}; });

var VERSO = "Sobre tus muros, oh Jerusalén, he puesto guardas; todo el día y toda la noche no callarán jamás.";

/* ============ utilidades ============ */
function esc(s){
  return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function pad(n){ return (n<10?"0":"")+n; }
function rango(h){ return pad(h)+":00 – "+pad((h+1)%24)+":00"; }
function ls(k,v){
  try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v); }catch(e){ return null; }
}
function ss(k,v){
  try{ if(v===undefined) return sessionStorage.getItem(k); sessionStorage.setItem(k,v); }catch(e){ return null; }
}
function sinTildes(s){
  return String(s).normalize ? String(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"") : String(s);
}
function claveDe(nombre){
  var base = sinTildes(nombre).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
  return miId + "_" + (base || "x");
}
function marcaLogo(clase){
  if (LOGO) return '<img class="logo '+clase+'" src="'+LOGO+'" alt="Embajadores de Cristo, Nueva Jerusalén">';
  return '<span class="logo monograma '+clase+'" aria-hidden="true">EC</span>';
}

var miId = ls("relevo:id");
if(!miId){ miId = "d"+Math.random().toString(36).slice(2,10); ls("relevo:id", miId); }

/* ============ estado local ============ */
var db = null, conectado = false, listo = false;
var S = {config:{}, resp:{}, gente:{}};
var aviso = null, fallo = null;
var perfil = ls("relevo:perfil");                 // null | "embajador" | "directiva"
var pidiendoCodigo = false;
var adminAbierto = false;
var desbloqueado = ss("relevo:admin") === "si";
var confirmandoVaciar = false;
var sembrado = false;

var API = {};
window.RELEVO = API;

/* ============ arranque ============ */
function arrancar(){
  if (!CONFIG_FIREBASE || !CONFIG_FIREBASE.databaseURL){ fallo = "falta-config"; pintar(); return; }
  try{
    firebase.initializeApp(CONFIG_FIREBASE);
    db = firebase.database();
  }catch(e){ fallo = "sin-conexion"; pintar(); return; }

  db.ref(".info/connected").on("value", function(s){
    conectado = s.val() === true;
    if (listo) pintar();
  });

  db.ref("tablero").on("value", function(snap){
    var v = snap.val() || {};
    S.config = Object.assign({}, CONFIG_DEF, v.config || {});
    S.resp   = v.resp   || {};
    S.gente  = v.gente  || {};
    listo = true; fallo = null;
    if (!v.config && !sembrado){
      sembrado = true;
      db.ref("tablero/config").set(CONFIG_DEF);
    } else if (v.config && (v.config.v || 1) < 2 && !sembrado){
      /* el tablero se creó con el título y el lema viejos: se actualizan una sola vez */
      sembrado = true;
      db.ref("tablero/config").update({v:2, titulo:CONFIG_DEF.titulo, lema:CONFIG_DEF.lema});
    }
    pintar();
  }, function(){ fallo = "sin-permiso"; pintar(); });
}

/* ============ lectura ============ */
function gente(ambito, slot){
  var rama = (S.gente[ambito] || {})[slot] || {};
  return Object.keys(rama).map(function(k){
    var p = rama[k] || {};
    return {k:k, n:p.n || "", d:p.d || ""};
  }).sort(function(a,b){ return (a.n||"").localeCompare(b.n||"","es"); });
}
function responsable(ambito, slot){ return (S.resp[ambito] || {})[slot] || null; }
function cupoDe(ambito, slot){
  if (ambito !== "cadena") return 0;
  for (var i=0;i<FRANJAS.length;i++) if (FRANJAS[i].id === slot) return FRANJAS[i].cupo;
  return 0;
}

/* ============ escritura ============ */
function avisar(txt, mal){ aviso = {txt:txt, mal:!!mal}; pintar(); }
function miNombre(){ return String(ls("relevo:nombre")||"").replace(/\s+/g," ").trim().slice(0,42); }

API.recordarNombre = function(v){ ls("relevo:nombre", String(v).replace(/\s+/g," ").slice(0,42)); };

API.unir = function(ambito, slot){
  if (!db) return;
  var n = miNombre();
  if (!n){ avisar("Primero escribe tu nombre.", true); return; }
  aviso = null;
  var cupo = cupoDe(ambito, slot);
  var k = claveDe(n);
  db.ref("tablero/gente/"+ambito+"/"+slot).transaction(function(actual){
    var m = actual || {};
    if (m[k]) return m;
    if (cupo && Object.keys(m).length >= cupo) return;
    m[k] = {n:n, d:miId, t:Date.now()};
    return m;
  }, function(err, comprometido){
    if (err) avisar("No se pudo guardar. Revisa tu conexión.", true);
    else if (!comprometido) avisar("Ese turno se llenó mientras te apuntabas. Elige otro.", true);
  });
};

API.salir = function(ambito, slot, k){
  if (!db) return;
  db.ref("tablero/gente/"+ambito+"/"+slot+"/"+k).remove();
};

/* ---- portada / perfiles ---- */
function nombrePortada(){
  var el = document.getElementById("nombrePortada");
  return el ? String(el.value).replace(/\s+/g," ").trim().slice(0,42) : "";
}
API.entrarComo = function(tipo){
  var n = nombrePortada();
  if (!n){
    avisar("Escribe tu nombre para continuar.", true);
    var el = document.getElementById("nombrePortada"); if (el) el.focus();
    return;
  }
  ls("relevo:nombre", n);
  if (tipo === "directiva"){ pidiendoCodigo = true; aviso = null; pintar();
    setTimeout(function(){ var c=document.getElementById("codigoPortada"); if(c) c.focus(); },30);
    return;
  }
  perfil = "embajador"; ls("relevo:perfil", perfil); aviso = null; pintar();
};
API.confirmarCodigo = function(){
  var el = document.getElementById("codigoPortada");
  var v = el ? el.value.trim() : "";
  if (v === String(S.config.pin)){
    perfil = "directiva"; ls("relevo:perfil", perfil);
    desbloqueado = true; ss("relevo:admin","si");
    pidiendoCodigo = false; aviso = null;
  } else {
    aviso = {txt:"Código incorrecto.", mal:true};
  }
  pintar();
};
API.cancelarCodigo = function(){ pidiendoCodigo = false; aviso = null; pintar(); };
API.cambiarPerfil = function(){
  perfil = null; ls("relevo:perfil","");
  desbloqueado = false; ss("relevo:admin","no");
  adminAbierto = false; pidiendoCodigo = false; aviso = null;
  pintar();
};

API.pantalla = function(on){
  ls("relevo:pantalla", on ? "si" : "no");
  document.body.classList.toggle("pantalla", !!on);
  pintar();
};

API.toggleAdmin = function(){ adminAbierto = !adminAbierto; aviso = null; pintar(); };

API.estrategia = function(cual){
  if (!db || S.config.estrategia === cual) return;
  db.ref("tablero/config/estrategia").set(cual);
};

API.guardarConfig = function(){
  if (!db) return;
  var g = function(id){ var e = document.getElementById(id); return e ? e.value : ""; };
  var dir = g("cfgDirectivos").split("\n").map(function(s){return s.trim();}).filter(Boolean);
  db.ref("tablero/config").update({
    titulo: g("cfgTitulo").trim() || S.config.titulo,
    mes: g("cfgMes").trim() || S.config.mes,
    lema: g("cfgLema").trim(),
    pin: g("cfgPin").trim() || S.config.pin,
    directivos: dir.length ? dir : S.config.directivos,
    cadenaFecha: g("cfgFechaCadena").trim(),
    semanaFechas: g("cfgFechasSemana").trim(),
    minutos: parseInt(g("cfgMinutos"),10) || 5,
    matFecha: g("cfgMatFecha").trim(),
    matHora: g("cfgMatHora").trim(),
    matLugar: g("cfgMatLugar").trim(),
    matPrograma: g("cfgMatPrograma")
  }).then(function(){ avisar("Cambios guardados."); });
};

API.sortear = function(){
  if (!db) return;
  var d = (S.config.directivos || []).slice();
  for (var i=d.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=d[i]; d[i]=d[j]; d[j]=t; }
  var ambito = S.config.estrategia === "semana" ? "semana" : "cadena";
  var lista = ambito === "semana" ? DIAS_ID : FRANJAS;
  var obj = {};
  for (var k=0;k<lista.length;k++) obj[lista[k].id] = k < d.length ? d[k] : null;
  db.ref("tablero/resp/"+ambito).set(obj);
};

API.abrirCerrar = function(){ if (db) db.ref("tablero/config/abierto").set(!S.config.abierto); };

API.vaciar = function(){
  if (!db) return;
  if (!confirmandoVaciar){
    confirmandoVaciar = true; pintar();
    setTimeout(function(){ confirmandoVaciar = false; pintar(); }, 6000);
    return;
  }
  confirmandoVaciar = false;
  db.ref("tablero/gente").remove();
};

/* ============ exportar el listado ============ */
function dosDig(n){ return (n<10?"0":"")+n; }
function selloFecha(){
  var d = new Date();
  return dosDig(d.getDate())+"/"+dosDig(d.getMonth()+1)+"/"+d.getFullYear()
       + " a las " + dosDig(d.getHours())+":"+dosDig(d.getMinutes());
}
function nombreArchivo(ext){
  var d = new Date();
  return "oracion-implacable-" + d.getFullYear()+dosDig(d.getMonth()+1)+dosDig(d.getDate())
       + "-" + dosDig(d.getHours())+dosDig(d.getMinutes()) + "." + ext;
}

function listadoTexto(){
  var c = S.config, L = [];
  L.push("*" + String(c.titulo || "Oración Implacable").toUpperCase() + "*");
  if (c.lema) L.push("_" + c.lema + "_");
  L.push("Embajadores de Cristo — Nueva Jerusalén");
  L.push("");

  if (c.estrategia === "cadena"){
    L.push("*CADENA DE ORACIÓN NOCTURNA*");
    if (c.cadenaFecha) L.push(c.cadenaFecha);
    var t = totales();
    L.push(t.t + " de " + t.c + " lugares tomados");
    L.push("");
    var vacias = [], incompletas = [];
    FRANJAS.forEach(function(f){
      var g = gente("cadena", f.id), r = responsable("cadena", f.id);
      L.push("*" + rango(f.ini) + "*  —  " + GRUPOS[f.grupo].n + "  (" + g.length + "/" + f.cupo + ")");
      L.push("Responsable: " + (r ? nombreCorto(r) : "sin asignar"));
      if (!g.length){ L.push("— nadie todavía —"); vacias.push(rango(f.ini)); }
      else g.forEach(function(p){ L.push("• " + p.n); });
      if (g.length && g.length < f.cupo) incompletas.push(rango(f.ini)+" ("+(f.cupo-g.length)+")");
      L.push("");
    });
    if (vacias.length) L.push("*Horas sin nadie:* " + vacias.join(", "));
    if (incompletas.length) L.push("*Horas con lugares libres:* " + incompletas.join(", "));
    if (!vacias.length && !incompletas.length) L.push("*Las nueve horas están completas.*");

  } else if (c.estrategia === "semana"){
    L.push("*SEMANA DE ORACIÓN — " + (c.minutos||5) + " MINUTOS AL DÍA*");
    if (c.semanaFechas) L.push(c.semanaFechas);
    L.push(totales().t + " participaciones");
    L.push("");
    DIAS_ID.forEach(function(d){
      var g = gente("semana", d.id), r = responsable("semana", d.id);
      L.push("*" + d.nombre + "*  (" + g.length + ")");
      L.push("Responsable: " + (r ? nombreCorto(r) : "sin asignar"));
      if (!g.length) L.push("— nadie todavía —");
      else g.forEach(function(p){ L.push("• " + p.n); });
      L.push("");
    });

  } else {
    var g2 = gente("matutino","todos");
    L.push("*MATUTINO PRESENCIAL*");
    L.push(c.matFecha + " — " + c.matHora + " — " + c.matLugar);
    L.push("");
    L.push("*Programa*");
    String(c.matPrograma||"").split("\n").forEach(function(l){
      l = l.trim(); if (!l) return;
      var p = l.split("|");
      L.push((p[0]||"").trim() + "  " + (p[1]||"").trim() + (p[2] ? "  — " + p[2].trim() : ""));
    });
    L.push("");
    L.push("*Confirmaron asistencia (" + g2.length + ")*");
    if (!g2.length) L.push("— nadie todavía —");
    else g2.forEach(function(p){ L.push("• " + p.n); });
  }

  L.push("");
  L.push("Listado generado el " + selloFecha());
  L.push("ecadnuevajerusalen.github.io");
  return L.join("\n");
}

function listadoCSV(){
  var c = S.config, filas = [];
  var esc2 = function(v){ return '"' + String(v==null?"":v).replace(/"/g,'""') + '"'; };
  var linea = function(a){ filas.push(a.map(esc2).join(",")); };

  if (c.estrategia === "cadena"){
    linea(["Franja","Inicio","Fin","Grupo","Cupo","Tomados","Libres","Responsable","Participante"]);
    FRANJAS.forEach(function(f){
      var g = gente("cadena", f.id), r = responsable("cadena", f.id);
      var base = [rango(f.ini), dosDig(f.ini)+":00", dosDig((f.ini+1)%24)+":00",
                  GRUPOS[f.grupo].n, f.cupo, g.length, f.cupo-g.length,
                  r ? nombreCorto(r) : "sin asignar"];
      if (!g.length) linea(base.concat([""]));
      else g.forEach(function(p){ linea(base.concat([p.n])); });
    });
  } else if (c.estrategia === "semana"){
    linea(["Día","Minutos","Participantes","Responsable","Participante"]);
    DIAS_ID.forEach(function(d){
      var g = gente("semana", d.id), r = responsable("semana", d.id);
      var base = [d.nombre, c.minutos||5, g.length, r ? nombreCorto(r) : "sin asignar"];
      if (!g.length) linea(base.concat([""]));
      else g.forEach(function(p){ linea(base.concat([p.n])); });
    });
  } else {
    linea(["Actividad","Fecha","Hora","Lugar","Confirmados","Participante"]);
    var g2 = gente("matutino","todos");
    var base2 = ["Matutino presencial", c.matFecha, c.matHora, c.matLugar, g2.length];
    if (!g2.length) linea(base2.concat([""]));
    else g2.forEach(function(p){ linea(base2.concat([p.n])); });
  }
  return filas.join("\r\n");
}

API.copiarListado = function(){
  var txt = listadoTexto();
  var mostrar = function(){
    var caja = document.getElementById("salidaListado");
    if (!caja) return;
    caja.innerHTML = '<label for="areaListado">Copia este texto y pégalo en el grupo</label>'
      + '<textarea id="areaListado" rows="10"></textarea>';
    var a = document.getElementById("areaListado");
    a.value = txt; a.focus(); a.select();
  };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){
      avisar("Listado copiado. Abre el grupo de WhatsApp y pégalo.");
    }).catch(mostrar);
  } else {
    mostrar();
  }
};

API.descargarCSV = function(){
  var contenido = "﻿" + listadoCSV();   // BOM para que Excel lea las tildes
  var blob = new Blob([contenido], {type:"text/csv;charset=utf-8"});
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = nombreArchivo("csv");
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
  avisar("Archivo descargado. Se abre con Excel.");
};

/* ============ piezas de pintado ============ */
function nombreCorto(linea){ return String(linea).split("|")[0].trim(); }
function esDirectiva(){ return perfil === "directiva" && desbloqueado; }

function totales(){
  var e = S.config.estrategia;
  if (e === "cadena"){
    var t=0,c=0;
    FRANJAS.forEach(function(f){ t += gente("cadena", f.id).length; c += f.cupo; });
    return {t:t,c:c};
  }
  if (e === "semana"){
    var t2=0; DIAS_ID.forEach(function(d){ t2 += gente("semana", d.id).length; });
    return {t:t2,c:0};
  }
  return {t: gente("matutino","todos").length, c:0};
}

function listaNombres(ambito, slot, clase){
  var g = gente(ambito, slot);
  if (!g.length) return '<p class="vacio">Sin apuntados</p>';
  return '<ul class="nombres '+(clase||"")+'">' + g.map(function(p){
    var mio = p.d === miId;
    var puede = mio || esDirectiva();
    return '<li class="'+(mio?"yo":"")+'"><span>'+esc(p.n)+'</span>'
      + (puede ? '<button class="quitar" aria-label="Quitar a '+esc(p.n)+'" onclick="RELEVO.salir(\''+ambito+'\',\''+slot+'\',\''+esc(p.k)+'\')">×</button>' : '')
      + '</li>';
  }).join("") + '</ul>';
}

function leyendaGrupos(){
  return '<div class="leyenda">' + ORDEN_GRUPOS.map(function(id){
    var g = GRUPOS[id];
    var horas = FRANJAS.filter(function(f){ return f.grupo === id; });
    var ini = horas[0].ini, fin = (horas[horas.length-1].ini + 1) % 24;
    var libres = horas.reduce(function(a,f){ return a + Math.max(0, f.cupo - gente("cadena",f.id).length); }, 0);
    return '<div class="ley '+g.c+'">'
      + '<span class="ley-n">'+esc(g.n)+'</span>'
      + '<span class="ley-d">'+pad(ini)+':00 &ndash; '+pad(fin)+':00</span>'
      + '<span class="ley-l">'+libres+(libres===1?' lugar libre':' lugares libres')+'</span>'
      + '</div>';
  }).join("") + '</div>';
}

function vistaCadena(){
  var abierto = S.config.abierto;
  var html = leyendaGrupos();

  html += '<div class="tira">' + FRANJAS.map(function(x){
    var g = GRUPOS[x.grupo];
    var lista = gente("cadena", x.id);
    var libres = x.cupo - lista.length;
    var lleno = libres <= 0;
    var r = responsable("cadena", x.id);
    return '<article class="col '+g.c+(lleno?" lleno":"")+(x.grupo==="implacables"?" elite":"")+'">'
      + '<span class="col-grupo">'+esc(g.n)+'</span>'
      + '<span class="col-hora">'+pad(x.ini)+'</span>'
      + '<span class="col-rango">'+rango(x.ini)+'</span>'
      + '<p class="col-libres '+(lleno?"cero":"")+'">'
      +   (lleno ? "Completo" : '<b>'+libres+'</b> '+(libres===1?'libre':'libres')+' de '+x.cupo) + '</p>'
      + listaNombres("cadena", x.id)
      + '<div class="col-pie">'
      +   '<span class="col-resp-et">Responsable</span>'
      +   '<span class="col-resp">'+(r ? esc(nombreCorto(r)) : "Sin asignar")+'</span>'
      +   (lleno || !abierto ? '' : '<button class="tomar" onclick="RELEVO.unir(\'cadena\',\''+x.id+'\')">Tomar</button>')
      + '</div></article>';
  }).join("") + '</div>';

  html += '<div class="reglas">'
    + '<div class="regla"><h4>Cómo funciona</h4><p>Cada grupo ora una hora completa, cada quien desde donde esté. No hay que salir de casa.</p></div>'
    + '<div class="regla"><h4>La estafeta</h4><p>Al terminar tu hora, reportas en el grupo de WhatsApp y le pasas la estafeta al grupo siguiente.</p></div>'
    + '<div class="regla"><h4>Despertarse</h4><p>Llámense entre ustedes, pongan alarmas, organícense como quieran. Lo único obligatorio es reportar el relevo.</p></div>'
    + '<div class="regla"><h4>El responsable</h4><p>Cada hora tiene un directivo que recuerda, anima y confirma que el relevo se dio.</p></div>'
    + '</div>';
  return html;
}

  html += '<div class="tira siete">' + DIAS_ID.map(function(d){
    var lista = gente("semana", d.id);
    var r = responsable("semana", d.id);
    return '<article class="col g1">'
      + '<span class="col-grupo">'+min+' minutos</span>'
      + '<span class="col-hora dia">'+esc(d.nombre)+'</span>'
      + '<span class="col-rango">a la hora que puedas</span>'
      + '<p class="col-libres"><b>'+lista.length+'</b> '+(lista.length===1?'persona':'personas')+'</p>'

  }).join("") + '</div>';

  html += '<div class="reglas">'

    + '<div class="regla"><h4>Puedes repetir</h4><p>Si quieres orar más de un día, apúntate en todos los que quieras.</p></div>'
    + '<div class="regla"><h4>El responsable</h4><p>El directivo del día recuerda y anima a quienes lo eligieron.</p></div>'
    + '<div class="regla"><h4>El objetivo</h4><p>Cinco minutos no son muchos. La meta es el hábito, no la hazaña.</p></div>'

    h += '<div class="acceso">'
      + '<label for="codigoPortada">Código de la directiva</label>'
      + '<input type="password" id="codigoPortada" placeholder="Código" '
      + 'onkeydown="if(event.key===\'Enter\')RELEVO.confirmarCodigo()">'
      + '<div class="acceso-botones">'
      + '<button class="primario" onclick="RELEVO.confirmarCodigo()">Entrar</button>'
      + '<button onclick="RELEVO.cancelarCodigo()">Regresar</button>'
      + '</div></div>';
  }

  if (aviso) h += '<p class="aviso '+(aviso.mal?"mal":"")+'">'+esc(aviso.txt)+'</p>';
  h += '</div></div>';
  return h;
}

/* ============ pantallas de fallo ============ */
function pantallaFallo(){
  var t = fallo === "falta-config" ? "Falta conectar la base"
        : "No se pudo conectar";
  var p = fallo === "falta-config"
        ? "Esta página todavía no tiene la configuración de la base de datos."
        : "El tablero no logra leer la base de datos. Revisa tu conexión; si el problema sigue, avísale a la directiva.";
  return '<div class="portada"><div class="portada-caja">'+marcaLogo("grande")
    + '<h1 class="titular">'+t+'</h1><hr class="regla-doble"><p class="pista">'+p+'</p></div></div>';
}

/* ============ pintado principal ============ */
function pintar(){
  var raiz = document.getElementById("app");

  if (fallo){ raiz.innerHTML = pantallaFallo(); return; }
  if (!listo){
    raiz.innerHTML = '<div class="portada"><div class="portada-caja">'+marcaLogo("grande")
      + '<p class="cargando">Cargando el tablero…</p></div></div>';
    return;
  }
  if (!perfil){ raiz.innerHTML = portada(); return; }

  var c = S.config, t = totales();
  var h = '<div class="envoltura">';

  /* --- cabecera --- */
  var meta = '<div class="meta">'
    + '<div class="meta-item"><span class="meta-et">Campaña</span><span class="meta-va">'+esc(c.mes)+'</span></div>';
  if (c.estrategia === "cadena")
    meta += '<div class="meta-item"><span class="meta-et">Fecha</span><span class="meta-va">'+esc(c.cadenaFecha)+'</span></div>';
  meta += '<div class="meta-item"><span class="meta-et">Apuntados</span><span class="meta-va oro">'
        + t.t + (t.c ? ' de ' + t.c : '') + '</span></div>'
        + '<div class="meta-item"><span class="meta-et">Inscripciones</span><span class="meta-va '
        + (c.abierto ? '' : 'mal') + '">' + (c.abierto ? 'Abiertas' : 'Cerradas') + '</span></div>'
        + '<div class="meta-item"><span class="meta-et">Tablero</span><span class="meta-va '
        + (conectado ? 'bien' : 'mal') + '">' + (conectado ? 'En vivo' : 'Reconectando') + '</span></div>'
        + '</div>';

  h += '<header class="cabecera">'
    + '<div class="cab-alto">'
    +   '<div class="cab-marca">'+marcaLogo("chico")+'<div class="cab-txt">'
    +     '<span class="rotulo">Embajadores de Cristo<i class="sep"></i>Nueva Jerusalén</span>'
    +     '<h1 class="titular">'+esc(c.titulo || CONFIG_DEF.titulo)+'</h1>'
    +     '<p class="lema">'+esc(c.lema || CONFIG_DEF.lema)+'</p>'
    +   '</div></div>'
    + '</div>'
    + '<hr class="regla-doble">'
    + meta
    + '</header>';

  /* --- barra de identidad --- */
  h += '<div class="barra">'
    + '<span class="quien">'+(perfil === "directiva" ? "Directiva" : "Embajador")+' · <b>'+esc(miNombre())+'</b></span>'
    + '<div class="barra-acc">'
    + (esDirectiva()
        ? '<button class="fantasma" onclick="RELEVO.toggleAdmin()">'+(adminAbierto?"Cerrar panel":"Panel")+'</button>'
          + '<button class="fantasma" onclick="RELEVO.pantalla(true)">Proyectar</button>'
        : '')
    + '<button class="fantasma" onclick="RELEVO.cambiarPerfil()">Salir</button>'
    + '</div></div>';

  if (aviso) h += '<div class="aviso '+(aviso.mal?"mal":"")+'">'+esc(aviso.txt)+'</div>';
  if (!c.abierto) h += '<div class="aviso"><b>Inscripciones cerradas.</b> El tablero queda visible, pero ya no se puede tomar turnos.</div>';

  h += panelAdmin();

  h += c.estrategia === "cadena" ? vistaCadena()
     : c.estrategia === "semana" ? vistaSemana()
     : vistaMatutino();

  h += '<blockquote class="verso banda"><hr class="regla-doble"><p>'+VERSO+'</p>'
     + '<cite>Isaías 62:6</cite><hr class="regla-doble"></blockquote>';
  h += '</div>';

  raiz.innerHTML = h;
  var proyectando = esDirectiva() && ls("relevo:pantalla") === "si";
  document.body.classList.toggle("pantalla", proyectando);
}

pintar();
arrancar();
})();

</script>
</body>
</html>
